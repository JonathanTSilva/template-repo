_subdirectory: template
_min_copier_version: "9.4.0"
_envops:
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true
_exclude:
  - copier.yml
  - copier.yaml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store

repo_name:
  type: str
  help: Repository name (lowercase kebab-case)
  validator: >-
    {% if not (repo_name | regex_search('^[a-z0-9]+(-[a-z0-9]+)*$')) %}
    Use lowercase kebab-case, for example my-repo.
    {% endif %}

description:
  type: str
  help: One-line description (also the GitHub description)
  validator: >-
    {% if not description | trim %}
    A description is required.
    {% endif %}

kind:
  type: str
  help: Kind of repository (see the naming page of the handbook)
  default: product
  choices:
    - product
    - jts
    - ai
    - research
    - course
    - learn
    - template
    - challenge
    - poc
    - infra
    - action
    - obsidian-plugin
    - homebrew-tap
    - awesome
    - special

stack:
  type: str
  help: Main stack, picks the CI workflow, hooks and commands
  default: none
  choices:
    - python
    - node
    - shell
    - go
    - rust
    - c-cpp
    - latex
    - none

visibility:
  type: str
  help: Repository visibility
  default: public
  choices:
    - public
    - private

license:
  type: str
  help: License (company-owned repos keep the company license and are not rendered from this template)
  default: mit
  choices:
    - mit
    - cc-by-4.0
    - mit+cc-by-4.0
    - proprietary
    - agpl-3.0

status:
  type: str
  help: Repo status (repostatus.org)
  default: wip
  choices:
    - concept
    - wip
    - active
    - inactive

has_release:
  type: bool
  help: Cut releases with release-please?
  default: false

year:
  type: int
  help: Copyright year
  default: "{{ '%Y' | strftime }}"

skeleton:
  type: bool
  help: Render the stack skeleton (manifest, source and test stubs)? Turn off when adopting an existing repo.
  default: true

# Opt-in CI suites. They only add jobs to ci.yml (and a badge), never files,
# so the defaults are safe for `copier update` on existing repos.
e2e:
  type: bool
  help: Run Playwright end-to-end tests (needs a pnpm project with @playwright/test)?
  default: false

lighthouse:
  type: bool
  help: Run Lighthouse CI against the built site?
  default: false

load:
  type: bool
  help: Run a k6 load test against a server started from a command?
  default: false

bench:
  type: bool
  help: Track benchmarks and alert on regressions (history on gh-pages)?
  default: false

reports:
  type: bool
  help: Publish an Allure report to GitHub Pages under /reports/?
  default: false

sonar:
  type: bool
  help: Is the repo analysed by SonarQube Cloud (Automatic Analysis)? Adds the quality-gate badge on public repos, no CI job.
  default: false

# Skeleton files are a starting point only. Rendering onto an existing repo
# (a migration, or `copier update`) must never overwrite real code.
_skip_if_exists:
  - pyproject.toml
  - .python-version
  - "src/{{ repo_name | replace('-', '_') }}/__init__.py"
  - tests/test_smoke.py
  - package.json
  - eslint.config.js
  - tsconfig.json
  - src/index.ts
  - tests/index.test.ts
  - "bin/{{ repo_name }}.sh"
  - "test/{{ repo_name }}.bats"
  - go.mod
  - sum.go
  - sum_test.go
  - Cargo.toml
  - Cargo.lock
  - src/lib.rs
  - CMakeLists.txt
  - src/sum.hpp
  - src/sum.cpp
  - tests/sum_test.cpp
  - main.tex
